<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="0.6" stop-color="#0d0f16"/>
      <stop offset="1" stop-color="#1a0508"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e63946" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e63946"/>
      <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- giant kanji 力 (power) -->
    <text x="930" y="270" font-size="320" font-family="'Noto Sans JP','Yu Gothic','Hiragino Sans',sans-serif" font-weight="900" fill="#e63946" opacity="0.10">力
      <animate attributeName="opacity" values="0.06;0.16;0.06" dur="4s" repeatCount="indefinite"/>
    </text>

    <!-- katana slashes -->
    <g stroke="url(#slash)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
      <line x1="-200" y1="60" x2="700" y2="-40" stroke-dasharray="900" stroke-dashoffset="900">
        <animate attributeName="stroke-dashoffset" values="900;0;0;-900" keyTimes="0;0.2;0.8;1" dur="6s" repeatCount="indefinite"/>
      </line>
      <line x1="500" y1="360" x2="1400" y2="230" stroke-dasharray="1000" stroke-dashoffset="1000">
        <animate attributeName="stroke-dashoffset" values="1000;1000;0;0;-1000" keyTimes="0;0.25;0.45;0.85;1" dur="6s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- top tag -->
    <text x="60" y="70" font-size="15" letter-spacing="6" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#e63946">
      [ ROOT ACCESS GRANTED ]
      <animate attributeName="opacity" values="1;1;0.3;1;1" keyTimes="0;0.8;0.85;0.9;1" dur="3s" repeatCount="indefinite"/>
    </text>

    <!-- glitch name -->
    <g font-family="'Arial Black','Impact','Segoe UI',sans-serif" font-weight="900" font-size="82" letter-spacing="4">
      <text x="56" y="168" fill="#00e5ff" opacity="0.55">ABHAY JASROTIA
        <animate attributeName="x" values="56;52;58;56;56;60;56" keyTimes="0;0.02;0.04;0.06;0.7;0.72;0.74" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="64" y="172" fill="#e63946" opacity="0.65">ABHAY JASROTIA
        <animate attributeName="x" values="64;68;62;64;64;58;64" keyTimes="0;0.02;0.04;0.06;0.7;0.72;0.74" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="170" fill="#f5f5f5">ABHAY JASROTIA</text>
    </g>

    <!-- subtitle -->
    <text x="62" y="222" font-size="22" letter-spacing="5" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" fill="#9aa4b2">
      SYSTEM ADMINISTRATOR <tspan fill="#e63946">//</tspan> LINUX <tspan fill="#e63946">·</tspan> AUTOMATION <tspan fill="#e63946">·</tspan> SECURITY
    </text>
    <text x="62" y="262" font-size="20" letter-spacing="8" font-family="'Noto Sans JP','Yu Gothic','Hiragino Sans',sans-serif" fill="#e63946" opacity="0.9">システム管理者</text>

    <!-- cursor -->
    <rect x="260" y="244" width="12" height="22" fill="#e63946">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- scanline -->
    <rect width="1200" height="3" fill="#ffffff" opacity="0.06">
      <animate attributeName="y" from="-10" to="330" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- frame -->
    <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#e63946" stroke-opacity="0.35"/>
    <path d="M1 40V1H40M1160 1H1199V40M1199 280V319H1160M40 319H1V280" fill="none" stroke="#e63946" stroke-width="3"/>
  </g>
</svg>
